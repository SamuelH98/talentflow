services:
  app:
    build: .
    image: talentflow:latest
    container_name: talentflow
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DB_PATH=/app/data/talentflow.db
      - UPLOADS_DIR=/app/data/uploads
      - JWT_SECRET=${JWT_SECRET:-local-dev-secret-change-me}
      - SEED_ON_BOOT=${SEED_ON_BOOT:-0}
    volumes:
      - talentflow-data:/app/data
    restart: unless-stopped

volumes:
  talentflow-data: